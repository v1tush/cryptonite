[project]
name = "cryptonite"
version = "0.1.0"
description = "A Django application for publishing and solving ciphers"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler==3.11.3",
    "django==5.2.19",
    "django-environ==0.12.0",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.11",
    "segno==1.6.6",
    "tzdata==2025.2",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["cryptonite"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "preserve"
