stages:
  - lint
  - test

black:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install black==23.7.0
  script:
    - black --check .

flake8:
  stage: lint
  image: registry.gitlab.com/pipeline-components/flake8:latest
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements/test.txt
    - flake8 --verbose .

django_tests:
  stage: test
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements/test.txt
    - cd cryptonite
    - python manage.py test
