{% extends 'base.html' %}
{% load i18n %}
{% load static %}
{% block content %}
<div class="tabs">
    <a class="tab {% if request.resolver_match.view_name == 'ciphers:library_community' %}active {% endif %}" {% if request.resolver_match.view_name != 'ciphers:library_community' %}href="{% url 'ciphers:library_community' %}"{% endif %}>Шифры сообщества</a>
    <a class="tab {% if request.resolver_match.view_name == 'ciphers:library_courses' %}active {% endif %}" {% if request.resolver_match.view_name != 'ciphers:library_courses' %}href="{% url 'ciphers:library_courses' %}"{% endif %}>Обучающие курсы</a>
</div>
<a class="btn btn-large">Создать курс</a>
{% if not courses %}
<p class="sub-text" style="display: block; width: 100%; text-align: center; padding: 200px;">Пока нет курсов</p>
{% endif %}
<script src="{% static 'js/libary.js' %}"></script>
<script src="{% static 'js/common.js' %}"></script>
{% endblock %}
