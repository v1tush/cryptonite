{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="section-title">Пароль успешно изменен!</h2>
        
        <div class="success-message">
            <div class="success-icon">✓</div>
            <p>Теперь вы можете войти в свой аккаунт с новым паролем.</p>
        </div>
        
        <div class="auth-links">
            <a href="{% url 'users:login' %}" class="btn">Войти в аккаунт</a>
        </div>
    </div>
</div>
{% endblock %}
