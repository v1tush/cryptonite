{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="section-title">Письмо отправлено!</h2>
        
        <div class="success-message">
            <div class="success-icon">✓</div>
            <p>Мы отправили вам email с инструкциями по восстановлению пароля.</p>
            <p>Если вы не получили письмо в течение нескольких минут, проверьте папку "Спам".</p>
        </div>
        
        <div class="auth-links">
            <a href="{% url 'users:login' %}" style="color: #282828;" class="btn">Вернуться к входу</a>
            <p class="mt-3"><a href="{% url 'users:password_reset' %}">Отправить письмо еще раз</a></p>
        </div>
    </div>
</div>
{% endblock %}
