{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
    <head>
        <title>Cryptonite</title>

        <link rel="icon" href="{% static 'images/favicon.png' %}" type="image/x-icon">

        <meta name="csrf-token" content="{{ csrf_token }}">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
        <link href="{% static 'css/cipher.css' %}" rel="stylesheet">
        <link href="{% static 'css/library.css' %}" rel="stylesheet">
        <link href="{% static 'css/main.css' %}" rel="stylesheet">
        <link href="{% static 'css/profile.css' %}" rel="stylesheet">
        <link href="{% static 'css/about.css' %}" rel="stylesheet">
        <link href="{% static 'css/signup.css' %}" rel="stylesheet">
        <link href="{% static 'css/create_cipher.css' %}" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
                {% include 'includes/header.html' %}
            </header>

            <main>
                {% block content %}
                <div style="display: block; color: #d79921; font-size: 60px; font-weight: bold; text-align: center; padding: 100px 0;">🚧Строительные работы 🛠🚧👷‍♂️</div>
                {% endblock %}
            </main>
            <footer>
                {% include 'includes/footer.html' %}
            </footer>
        </div>
    </body>
</html>
