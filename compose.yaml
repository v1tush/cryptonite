name: cryptonite

x-django: &django
  image: cryptonite-local
  build: .
  environment:
    DJANGO_DEBUG: "True"
    DJANGO_DB_HOST: db
    DJANGO_DB_NAME: "${DJANGO_DB_NAME:-cryptonite}"
    DJANGO_DB_USER: "${DJANGO_DB_USER:-cryptonite}"
    DJANGO_DB_PASSWORD: "${DJANGO_DB_PASSWORD:-cryptonite-local-only}"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DJANGO_DB_NAME:-cryptonite}"
      POSTGRES_USER: "${DJANGO_DB_USER:-cryptonite}"
      POSTGRES_PASSWORD: "${DJANGO_DB_PASSWORD:-cryptonite-local-only}"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *django
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *django
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6

  scheduler:
    <<: *django
    command: ["python", "manage.py", "run_scheduler"]
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres:
  media:
